<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B2035"/>
      <stop offset="50%" style="stop-color:#0f2d4a"/>
      <stop offset="100%" style="stop-color:#1a365d"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#23bfe2"/>
      <stop offset="100%" style="stop-color:#1da1bf"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="280" fill="url(#bg4)"/>

  <!-- Background decorative elements -->
  <circle cx="200" cy="130" r="100" fill="#23bfe2" opacity="0.03"/>
  <circle cx="100" cy="230" r="45" fill="#23bfe2" opacity="0.05"/>

  <!-- Magnetic wave pulses emanating from brain -->
  <g transform="translate(200, 105)">
    <!-- Outer pulse rings -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#23bfe2" stroke-width="1" opacity="0.2">
      <animate attributeName="r" values="80;100;80" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.05;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#23bfe2" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="60;85;60" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Brain shape -->
    <ellipse cx="0" cy="5" rx="40" ry="36" fill="#0B2035" stroke="url(#accent4)" stroke-width="3" filter="url(#glow4)"/>

    <!-- Brain hemisphere split -->
    <path d="M0 -31 Q-4 0 0 40" fill="none" stroke="#23bfe2" stroke-width="1.5" opacity="0.5"/>

    <!-- Brain folds left -->
    <path d="M-27 -13 Q-18 -22 -9 -13 Q-4 -4 -13 5 Q-22 9 -27 -4" fill="none" stroke="url(#cyan)" stroke-width="2" opacity="0.8"/>
    <path d="M-22 13 Q-13 22 -4 18" fill="none" stroke="url(#cyan)" stroke-width="1.5" opacity="0.6"/>

    <!-- Brain folds right -->
    <path d="M27 -13 Q18 -22 9 -13 Q4 -4 13 5 Q22 9 27 -4" fill="none" stroke="url(#cyan)" stroke-width="2" opacity="0.8"/>
    <path d="M22 13 Q13 22 4 18" fill="none" stroke="url(#cyan)" stroke-width="1.5" opacity="0.6"/>

    <!-- Neural connection nodes -->
    <circle cx="-18" cy="-9" r="5" fill="#23bfe2" filter="url(#glow4)"/>
    <circle cx="0" cy="-18" r="7" fill="#23bfe2" filter="url(#glow4)"/>
    <circle cx="18" cy="-9" r="5" fill="#23bfe2" filter="url(#glow4)"/>
    <circle cx="-13" cy="13" r="4" fill="#23bfe2" opacity="0.8"/>
    <circle cx="13" cy="13" r="4" fill="#23bfe2" opacity="0.8"/>
    <circle cx="0" cy="22" r="5" fill="#23bfe2" filter="url(#glow4)"/>

    <!-- Neural connections -->
    <line x1="-18" y1="-9" x2="0" y2="-18" stroke="#23bfe2" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-18" x2="18" y2="-9" stroke="#23bfe2" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-18" x2="0" y2="22" stroke="#23bfe2" stroke-width="1.5" opacity="0.5"/>
    <line x1="-13" y1="13" x2="0" y2="22" stroke="#23bfe2" stroke-width="1" opacity="0.4"/>
    <line x1="13" y1="13" x2="0" y2="22" stroke="#23bfe2" stroke-width="1" opacity="0.4"/>
    <line x1="-18" y1="-9" x2="-13" y2="13" stroke="#23bfe2" stroke-width="1" opacity="0.4"/>
    <line x1="18" y1="-9" x2="13" y2="13" stroke="#23bfe2" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Magnetic coil helmet suggestion - left -->
  <path d="M70 85 Q52 102 60 140" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M66 94 Q50 107 57 134" fill="none" stroke="url(#cyan)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Magnetic coil helmet suggestion - right -->
  <path d="M330 85 Q348 102 340 140" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M334 94 Q350 107 343 134" fill="none" stroke="url(#cyan)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Pulse waves from sides -->
  <g opacity="0.4">
    <path d="M55 112 Q46 103 55 94" fill="none" stroke="#23bfe2" stroke-width="2"/>
    <path d="M46 120 Q37 111 46 102" fill="none" stroke="#23bfe2" stroke-width="1.5"/>
    <path d="M345 112 Q354 103 345 94" fill="none" stroke="#23bfe2" stroke-width="2"/>
    <path d="M354 120 Q363 111 354 102" fill="none" stroke="#23bfe2" stroke-width="1.5"/>
  </g>

  <!-- Bottom label -->
  <rect x="100" y="200" width="200" height="4" rx="2" fill="url(#accent4)" opacity="0.5"/>
  <text x="200" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">SCIENCE</text>

  <!-- Corner accents -->
  <line x1="20" y1="20" x2="60" y2="20" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>
  <line x1="20" y1="20" x2="20" y2="60" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="260" x2="340" y2="260" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="260" x2="380" y2="220" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>

  <!-- DNA helix hint -->
  <g transform="translate(340, 185)" opacity="0.3">
    <circle cx="0" cy="0" r="3" fill="#23bfe2"/>
    <circle cx="7" cy="9" r="3" fill="#23bfe2"/>
    <circle cx="0" cy="18" r="3" fill="#23bfe2"/>
    <line x1="0" y1="0" x2="7" y2="9" stroke="#23bfe2" stroke-width="1"/>
    <line x1="7" y1="9" x2="0" y2="18" stroke="#23bfe2" stroke-width="1"/>
  </g>
</svg>