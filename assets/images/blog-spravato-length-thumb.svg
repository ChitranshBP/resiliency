<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B2035"/>
      <stop offset="100%" style="stop-color:#163554"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#23bfe2;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#23bfe2;stop-opacity:0"/>
    </linearGradient>
    <clipPath id="circleClip3">
      <circle cx="95" cy="120" r="75"/>
    </clipPath>
    <clipPath id="circleClip4">
      <circle cx="320" cy="120" r="70"/>
    </clipPath>
  </defs>
  <rect width="400" height="240" fill="url(#bg2)"/>
  <ellipse cx="200" cy="120" rx="200" ry="110" fill="url(#glow2)"/>
  <!-- Left side - Doctor image -->
  <g clip-path="url(#circleClip3)">
    <rect x="20" y="45" width="150" height="150" fill="#1a3a5c"/>
    <image href="assets/images/dr_profile.png" x="20" y="45" width="150" height="150" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="95" cy="120" r="75" fill="none" stroke="#23bfe2" stroke-width="3"/>
  </g>
  <!-- Right side - Clock with treatment time -->
  <g clip-path="url(#circleClip4)">
    <rect x="250" y="50" width="140" height="140" fill="#0d2840"/>
    <!-- Clock face -->
    <circle cx="320" cy="120" r="50" fill="none" stroke="#23bfe2" stroke-width="2.5"/>
    <circle cx="320" cy="120" r="45" fill="none" stroke="#23bfe2" stroke-width="1" opacity="0.3"/>
    <!-- Hour markers -->
    <g stroke="#23bfe2" stroke-width="2">
      <line x1="320" y1="75" x2="320" y2="82"/>
      <line x1="365" y1="120" x2="358" y2="120"/>
      <line x1="320" y1="165" x2="320" y2="158"/>
      <line x1="275" y1="120" x2="282" y2="120"/>
    </g>
    <!-- Clock hands -->
    <line x1="320" y1="120" x2="320" y2="88" stroke="#23bfe2" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="320" y1="120" x2="345" y2="132" stroke="#23bfe2" stroke-width="2" stroke-linecap="round"/>
    <circle cx="320" cy="120" r="4" fill="#23bfe2"/>
    <circle cx="320" cy="120" r="70" fill="none" stroke="#23bfe2" stroke-width="3"/>
  </g>
  <!-- Connecting element -->
  <g stroke="#23bfe2" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M170,120 L250,120" stroke-dasharray="4,4"/>
    <path d="M175,115 L245,115" stroke-dasharray="4,4"/>
    <path d="M175,125 L245,125" stroke-dasharray="4,4"/>
  </g>
  <!-- Time indicator text -->
  <text x="320" y="195" font-family="Arial, sans-serif" font-size="9" fill="#23bfe2" text-anchor="middle" font-weight="bold">2 HRS</text>
  <text x="200" y="225" font-family="Arial, sans-serif" font-size="10" fill="#23bfe2" text-anchor="middle" font-weight="bold" letter-spacing="1">SPRAVATO TREATMENT</text>
</svg>