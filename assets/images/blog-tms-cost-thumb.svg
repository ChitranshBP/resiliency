<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B2035"/>
      <stop offset="50%" style="stop-color:#0f2d4a"/>
      <stop offset="100%" style="stop-color:#1a365d"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#23bfe2"/>
      <stop offset="100%" style="stop-color:#1da1bf"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="280" fill="url(#bg1)"/>

  <!-- Background decorative elements -->
  <circle cx="50" cy="220" r="80" fill="#23bfe2" opacity="0.05"/>
  <circle cx="350" cy="50" r="60" fill="#23bfe2" opacity="0.08"/>

  <!-- Medical cross with dollar sign -->
  <g transform="translate(200, 115)" filter="url(#glow1)">
    <!-- Outer glow ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#23bfe2" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#23bfe2" stroke-width="0.5" opacity="0.2"/>

    <!-- Background circle -->
    <circle cx="0" cy="0" r="60" fill="#0B2035" stroke="url(#accent1)" stroke-width="3"/>

    <!-- Dollar sign -->
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="url(#gold)" text-anchor="middle">$</text>

    <!-- Small medical cross accent -->
    <rect x="35" y="-40" width="8" height="24" rx="2" fill="#23bfe2" opacity="0.8"/>
    <rect x="27" y="-32" width="24" height="8" rx="2" fill="#23bfe2" opacity="0.8"/>
  </g>

  <!-- Bottom label bar -->
  <rect x="100" y="200" width="200" height="4" rx="2" fill="url(#accent1)" opacity="0.5"/>

  <!-- Cost text -->
  <text x="200" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">COST GUIDE</text>

  <!-- Corner accents -->
  <line x1="20" y1="20" x2="60" y2="20" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>
  <line x1="20" y1="20" x2="20" y2="60" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="260" x2="340" y2="260" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="260" x2="380" y2="220" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>

  <!-- Floating coins -->
  <circle cx="320" cy="70" r="15" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
  <text x="320" y="75" font-family="Arial" font-size="14" fill="url(#gold)" text-anchor="middle" opacity="0.8">$</text>
  <circle cx="80" cy="90" r="12" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  <text x="80" y="95" font-family="Arial" font-size="12" fill="url(#gold)" text-anchor="middle" opacity="0.7">$</text>
</svg>