<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B2035"/>
      <stop offset="100%" style="stop-color:#163554"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#23bfe2;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#23bfe2;stop-opacity:0"/>
    </linearGradient>
    <clipPath id="circleClip1">
      <circle cx="95" cy="120" r="75"/>
    </clipPath>
    <clipPath id="circleClip2">
      <circle cx="320" cy="120" r="70"/>
    </clipPath>
  </defs>
  <rect width="400" height="240" fill="url(#bg1)"/>
  <ellipse cx="200" cy="120" rx="200" ry="110" fill="url(#glow1)"/>
  <!-- Left side - Doctor image -->
  <g clip-path="url(#circleClip1)">
    <rect x="20" y="45" width="150" height="150" fill="#1a3a5c"/>
    <image href="assets/images/dr_profile.png" x="20" y="45" width="150" height="150" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="95" cy="120" r="75" fill="none" stroke="#23bfe2" stroke-width="3"/>
  </g>
  <!-- Right side - Brain with neural network -->
  <g clip-path="url(#circleClip2)">
    <rect x="250" y="50" width="140" height="140" fill="#0d2840"/>
    <!-- Brain outline -->
    <g transform="translate(320, 120)" fill="none" stroke="#23bfe2" stroke-width="2">
      <path d="M-40,-25 C-40,-42 -25,-48 -8,-48 C10,-48 25,-42 32,-28 C40,-15 45,0 45,12 C45,28 36,42 24,45 C12,48 -12,48 -24,45 C-36,42 -45,28 -45,12 C-45,0 -40,-15 -32,-28 C-25,-42 -10,-42 -8,-48 C-16,-48 -24,-38 -28,-24 C-32,-12 -36,0 -36,12 C-36,24 -32,32 -24,36 C-16,40 -8,40 0,38" stroke-width="2.5"/>
      <!-- Neural connections -->
      <circle cx="-24" cy="-8" r="3" fill="#23bfe2"/>
      <circle cx="-8" cy="-20" r="3" fill="#23bfe2"/>
      <circle cx="12" cy="-12" r="3" fill="#23bfe2"/>
      <circle cx="20" cy="4" r="3" fill="#23bfe2"/>
      <circle cx="8" cy="16" r="3" fill="#23bfe2"/>
      <circle cx="-16" cy="12" r="3" fill="#23bfe2"/>
      <line x1="-24" y1="-8" x2="-8" y2="-20" stroke-width="1.5" opacity="0.7"/>
      <line x1="-8" y1="-20" x2="12" y2="-12" stroke-width="1.5" opacity="0.7"/>
      <line x1="12" y1="-12" x2="20" y2="4" stroke-width="1.5" opacity="0.7"/>
      <line x1="20" y1="4" x2="8" y2="16" stroke-width="1.5" opacity="0.7"/>
      <line x1="8" y1="16" x2="-16" y2="12" stroke-width="1.5" opacity="0.7"/>
      <line x1="-16" y1="12" x2="-24" y2="-8" stroke-width="1.5" opacity="0.7"/>
    </g>
    <circle cx="320" cy="120" r="70" fill="none" stroke="#23bfe2" stroke-width="3"/>
  </g>
  <!-- Connecting element -->
  <g stroke="#23bfe2" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M170,120 L250,120" stroke-dasharray="4,4"/>
    <path d="M175,115 L245,115" stroke-dasharray="4,4"/>
    <path d="M175,125 L245,125" stroke-dasharray="4,4"/>
  </g>
  <!-- Label -->
  <text x="200" y="225" font-family="Arial, sans-serif" font-size="10" fill="#23bfe2" text-anchor="middle" font-weight="bold" letter-spacing="1">DEEP TMS TREATMENT</text>
</svg>