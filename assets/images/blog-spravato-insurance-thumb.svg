<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B2035"/>
      <stop offset="50%" style="stop-color:#0f2d4a"/>
      <stop offset="100%" style="stop-color:#1a365d"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#23bfe2"/>
      <stop offset="100%" style="stop-color:#1da1bf"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="280" fill="url(#bg2)"/>

  <!-- Background decorative elements -->
  <circle cx="350" cy="220" r="100" fill="#23bfe2" opacity="0.05"/>
  <circle cx="50" cy="50" r="50" fill="#23bfe2" opacity="0.08"/>

  <!-- Shield with layers -->
  <g transform="translate(200, 105)" filter="url(#glow2)">
    <!-- Outer glow -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#23bfe2" stroke-width="1" opacity="0.3"/>

    <!-- Shield shape -->
    <path d="M0 -60 L55 -40 L55 15 Q55 60 0 85 Q-55 60 -55 15 L-55 -40 Z" fill="#0B2035" stroke="url(#accent2)" stroke-width="3"/>

    <!-- Inner shield layer -->
    <path d="M0 -48 L42 -30 L42 12 Q42 48 0 65 Q-42 48 -42 12 L-42 -30 Z" fill="none" stroke="#23bfe2" stroke-width="1" opacity="0.5"/>

    <!-- Checkmark -->
    <polyline points="-22,3 -7,22 27,-18" fill="none" stroke="url(#green)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Small document/insurance icon -->
    <rect x="-13" y="-55" width="26" height="18" rx="3" fill="none" stroke="#23bfe2" stroke-width="2" opacity="0.7"/>
    <line x1="-7" y1="-47" x2="7" y2="-47" stroke="#23bfe2" stroke-width="2" opacity="0.5"/>
    <line x1="-7" y1="-41" x2="10" y2="-41" stroke="#23bfe2" stroke-width="2" opacity="0.5"/>
    <line x1="-7" y1="-35" x2="4" y2="-35" stroke="#23bfe2" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- 100% badge -->
  <g transform="translate(280, 150)">
    <circle cx="0" cy="0" r="24" fill="url(#green)" filter="url(#glow2)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0B2035" text-anchor="middle">$0</text>
  </g>

  <!-- Bottom label -->
  <rect x="100" y="200" width="200" height="4" rx="2" fill="url(#accent2)" opacity="0.5"/>
  <text x="200" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">INSURANCE</text>

  <!-- Corner accents -->
  <line x1="20" y1="20" x2="60" y2="20" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>
  <line x1="20" y1="20" x2="20" y2="60" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="260" x2="340" y2="260" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="260" x2="380" y2="220" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>

  <!-- Stars decoration -->
  <polygon points="60,80 63,90 74,90 65,96 68,107 60,100 52,107 55,96 46,90 57,90" fill="#23bfe2" opacity="0.3"/>
  <polygon points="340,90 342,97 350,97 344,102 346,110 340,105 334,110 336,102 330,97 338,97" fill="#23bfe2" opacity="0.4"/>
</svg>