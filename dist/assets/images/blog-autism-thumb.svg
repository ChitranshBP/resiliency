<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B2035"/>
      <stop offset="50%" style="stop-color:#0f2d4a"/>
      <stop offset="100%" style="stop-color:#1a365d"/>
    </linearGradient>
    <linearGradient id="accent5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#23bfe2"/>
      <stop offset="100%" style="stop-color:#1da1bf"/>
    </linearGradient>
    <linearGradient id="purple5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="280" fill="url(#bg5)"/>

  <!-- Background elements -->
  <circle cx="350" cy="50" r="70" fill="#a855f7" opacity="0.05"/>
  <circle cx="50" cy="230" r="60" fill="#23bfe2" opacity="0.08"/>

  <!-- Brain with connected puzzle pieces -->
  <g transform="translate(200, 100)" filter="url(#glow5)">
    <!-- Outer pulse ring -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#23bfe2" stroke-width="1" opacity="0.3"/>

    <!-- Brain shape -->
    <ellipse cx="0" cy="5" rx="42" ry="38" fill="#0B2035" stroke="url(#accent5)" stroke-width="3"/>

    <!-- Brain folds with purple accent -->
    <path d="M-28 -12 Q-18 -22 -8 -12 Q-3 -2 -12 6 Q-22 10 -28 -4" fill="none" stroke="url(#purple5)" stroke-width="2" opacity="0.8"/>
    <path d="M28 -12 Q18 -22 8 -12 Q3 -2 12 6 Q22 10 28 -4" fill="none" stroke="url(#purple5)" stroke-width="2" opacity="0.8"/>
    <path d="M-22 15 Q-12 25 -2 20" fill="none" stroke="url(#purple5)" stroke-width="1.5" opacity="0.6"/>
    <path d="M22 15 Q12 25 2 20" fill="none" stroke="url(#purple5)" stroke-width="1.5" opacity="0.6"/>

    <!-- Connection nodes on brain -->
    <circle cx="-20" cy="-8" r="5" fill="#23bfe2" filter="url(#glow5)"/>
    <circle cx="0" cy="-18" r="6" fill="#23bfe2" filter="url(#glow5)"/>
    <circle cx="20" cy="-8" r="5" fill="#23bfe2" filter="url(#glow5)"/>
    <circle cx="-15" cy="15" r="4" fill="#a855f7"/>
    <circle cx="15" cy="15" r="4" fill="#a855f7"/>
  </g>

  <!-- Puzzle pieces connecting to brain -->
  <g transform="translate(200, 100)">
    <!-- Puzzle piece left -->
    <path d="M-65 -15 L-50 -15 Q-47 -22 -40 -22 Q-37 -15 -30 -15 L-30 -5 Q-23 -8 -23 -15 Q-30 -22 -30 -30 L-40 -30 Q-47 -30 -50 -22 Q-57 -22 -57 -15 Z" fill="url(#purple5)" opacity="0.8" filter="url(#glow5)"/>

    <!-- Puzzle piece right -->
    <path d="M65 -15 L50 -15 Q47 -22 40 -22 Q37 -15 30 -15 L30 -5 Q23 -8 23 -15 Q30 -22 30 -30 L40 -30 Q47 -30 50 -22 Q57 -22 57 -15 Z" fill="url(#purple5)" opacity="0.8" filter="url(#glow5)"/>

    <!-- Puzzle piece bottom -->
    <path d="M-15 75 L-15 60 Q-22 57 -22 50 Q-15 47 -15 40 L-5 40 Q-8 33 -15 33 Q-22 40 -30 40 L-30 50 Q-30 57 -22 57 Z" fill="url(#accent5)" opacity="0.8"/>
  </g>

  <!-- Connecting lines -->
  <g opacity="0.4">
    <line x1="115" y1="85" x2="140" y2="100" stroke="#a855f7" stroke-width="2"/>
    <line x1="285" y1="85" x2="260" y2="100" stroke="#a855f7" stroke-width="2"/>
    <line x1="200" y1="180" x2="200" y2="165" stroke="#23bfe2" stroke-width="2"/>
  </g>

  <!-- Plus sign for support -->
  <g transform="translate(320, 160)" opacity="0.5">
    <rect x="-8" y="-18" width="16" height="36" rx="3" fill="#23bfe2"/>
    <rect x="-18" y="-8" width="36" height="16" rx="3" fill="#23bfe2"/>
  </g>

  <!-- Bottom label -->
  <rect x="100" y="200" width="200" height="4" rx="2" fill="url(#accent5)" opacity="0.5"/>
  <text x="200" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">AUTISM SUPPORT</text>

  <!-- Corner accents -->
  <line x1="20" y1="20" x2="60" y2="20" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>
  <line x1="20" y1="20" x2="20" y2="60" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="260" x2="340" y2="260" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="260" x2="380" y2="220" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>

  <!-- Small brain icons -->
  <ellipse cx="70" cy="70" rx="18" ry="15" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.3"/>
  <ellipse cx="340" cy="200" rx="15" ry="12" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.3"/>
</svg>