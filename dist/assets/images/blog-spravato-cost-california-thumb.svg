<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B2035"/>
      <stop offset="50%" style="stop-color:#0f2d4a"/>
      <stop offset="100%" style="stop-color:#1a365d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#23bfe2"/>
      <stop offset="100%" style="stop-color:#1da1bf"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="280" fill="url(#bg)"/>

  <!-- Background decorative elements -->
  <circle cx="350" cy="220" r="100" fill="#23bfe2" opacity="0.05"/>
  <circle cx="50" cy="50" r="50" fill="#23bfe2" opacity="0.08"/>

  <!-- Center Crest -->
  <g transform="translate(200, 105)" filter="url(#glow)">
    <!-- Outer glow ring -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#23bfe2" stroke-width="1" opacity="0.3"/>
    
    <!-- Outer circle badge -->
    <circle cx="0" cy="0" r="62" fill="#0B2035" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#23bfe2" stroke-width="1" opacity="0.5"/>

    <!-- California Star (Gold) -->
    <polygon points="0,-32 3.5,-21 15,-21 6.5,-14 9.5,-3 0,-9.5 -9.5,-3 -6.5,-14 -15,-21 -3.5,-21" fill="url(#gold)" opacity="0.95"/>

    <!-- Dollar Sign (Gold) -->
    <text x="0" y="27" font-family="Arial, sans-serif" font-weight="bold" font-size="44" fill="url(#gold)" text-anchor="middle">$</text>
  </g>

  <!-- $10 Manufacturer Savings Badge (Green) -->
  <g transform="translate(265, 145)" filter="url(#glow)">
    <circle cx="0" cy="0" r="22" fill="url(#green)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B2035" text-anchor="middle">$10</text>
  </g>

  <!-- Bottom label bar -->
  <rect x="100" y="200" width="200" height="4" rx="2" fill="url(#accent)" opacity="0.5"/>
  <text x="200" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">CALIFORNIA COST</text>

  <!-- Corner accents -->
  <line x1="20" y1="20" x2="60" y2="20" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>
  <line x1="20" y1="20" x2="20" y2="60" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="260" x2="340" y2="260" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="260" x2="380" y2="220" stroke="#23bfe2" stroke-width="2" opacity="0.6"/>

  <!-- Star accents -->
  <polygon points="60,80 62,85 68,85 63,88 65,94 60,90 55,94 57,88 52,85 58,85" fill="#23bfe2" opacity="0.3"/>
  <polygon points="340,90 342,95 348,95 343,98 345,104 340,100 335,104 337,98 332,95 338,95" fill="#23bfe2" opacity="0.4"/>
</svg>
