[build]
  command = "php build.php"
  publish = "dist"

# 301 redirects are defined in _redirects file (copied to dist/ during build)
# _redirects file rules take precedence over [[redirects]] in netlify.toml

# Cache static assets for performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Catch-all: serve HTML pages without .html extension
# This runs AFTER _redirects rules, so 301s are processed first
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  condition = {path = ["!/assets/*", "!/css/*", "!/js/*", "!/*.html", "!/sitemap.xml"]}
